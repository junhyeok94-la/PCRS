services:
  - type: web
    name: pcrs-api-beta
    plan: free
    runtime: python
    rootDir: .
    buildCommand: pip install -r weather_api/requirements.txt
    startCommand: uvicorn weather_api.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log --no-proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: KMA_SERVICE_KEY
        sync: false
      # A conservative per-KST-day cap in this instance's SQLite store.
      # Free Render restarts discard this counter: this is NOT a durable account quota.
      - key: KMA_DAILY_REQUEST_LIMIT
        value: "200"
