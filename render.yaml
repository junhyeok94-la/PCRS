services:
  - type: web
    name: pcrs-api-beta
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: PUBLIC_RECOMMEND_RATE_LIMIT
        value: "20"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: WEATHER_WARMUP_ON_STARTUP
        value: "false"
